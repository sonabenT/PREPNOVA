{% extends "base.html" %}

{% block content %}
<div class="login-wrapper">
    <div class="login-card">
        <h2>Reset Password</h2>
        <p style="color: var(--text-muted); margin-bottom: 1.5rem; font-size: 0.9rem;">
            Enter your registered username to reset your password.
        </p>
        <form method="POST" action="{{ url_for('forgot_password') }}">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="new_password">New Password</label>
                <input type="password" id="new_password" name="new_password" required>
            </div>
            <button type="submit" class="btn-gradient">Update Password</button>
        </form>
        <p style="margin-top: 1rem; font-size: 0.875rem;">
            <a href="{{ url_for('login') }}" style="color: var(--accent-purple); text-decoration: none;">Back to Login</a>
        </p>
    </div>
</div>
{% endblock %}
