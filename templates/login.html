{% extends "base.html" %}

{% block content %}
<div class="login-wrapper">
    <div class="login-card">
        <h2>Login</h2>
        <form method="POST" action="{{ url_for('login') }}">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="btn-gradient">Log In</button>
        </form>
        <p style="margin-top: 1rem; text-align: center; font-size: 0.875rem;">
            <a href="{{ url_for('forgot_password') }}" style="color: var(--accent-purple); text-decoration: none;">Forgot Password?</a>
        </p>
    </div>
</div>
{% endblock %}
